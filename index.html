      <meta name="robots" content="index, follow" />
      <script>
        // Belt-and-suspenders: flip robots to noindex immediately, before the
        // React bundle runs, on any host that isn't the live production domain
        // (e.g. the *.vercel.app review URL). src/app/seo.ts enforces the same
        // rule for every client-side route change.
        (function () {
          var prodHosts = ["edbuddies.ai", "www.edbuddies.ai"];
          if (prodHosts.indexOf(window.location.hostname) === -1) {
            var m = document.querySelector('meta[name="robots"]');
            if (m) m.setAttribute("content", "noindex, nofollow");
          }
        })();
      </script>
